name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile, test and package
        run: mvn -B verify

      - name: Upload runnable jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redisj-jar
          path: target/redisj.jar
          if-no-files-found: warn
          retention-days: 7
